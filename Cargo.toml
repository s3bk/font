[package]
name = "font"
version = "0.1.0"
authors = ["Sebastian Köln <s3bk@protonmail.org>"]
edition = "2018"

[features]
unstable = ["slotmap/unstable", "tuple/nightly"]
svg = ["svg_dom", "inflate"]
woff = ["brotli-decompressor", "inflate"]
type1 = ["postscript"]
type2 = []
opentype = []
cff = ["type1", "type2"]
postscript = []
math = []
vello = ["vello_encoding"]
default = ["opentype"]

[dependencies]
pdf_encoding = "0.4"
pathfinder_geometry = { git = "https://github.com/servo/pathfinder/" }
pathfinder_content = { git = "https://github.com/servo/pathfinder/" }
pathfinder_color = { git = "https://github.com/servo/pathfinder/" }
tuple = { git = "https://github.com/s3bk/tuple/" }
nom = "5.1"
log = "0.4"
slotmap = { version = "1.0" }
decorum = "0.3"
itertools = "0.10"
indexmap = "1.9"
brotli-decompressor = { version = "2.3", optional = true }
inflate = { version = "0.4.5", optional = true }
svg_dom = { git = "https://github.com/s3bk/svg", optional=true }
istring = "0.3.4"
# Pinned: the vello encoder API this crate implements (`PathEncoder`, and the
# `Pen` impl in `src/lib.rs`) is written against this version. A `*`
# requirement lets a fresh resolution pick a different copy, which both breaks
# that code and puts a second `PathEncoder` in the graph — then a downstream
# `type Pen = PathEncoder` no longer satisfies `Pen`. `pdf_render` pins the
# same version.
vello_encoding = { version = "=0.11.0", optional = true }

[dev-dependencies]
svg_dom = { git = "https://github.com/s3bk/svg" }
svg_draw = { git = "https://github.com/s3bk/svg" }
pathfinder_renderer = { git = "https://github.com/servo/pathfinder/" }
pathfinder_export = { git = "https://github.com/servo/pathfinder/" }
walkdir = "2.3"
env_logger = { version = "*" }
memmap = "*"

[patch."https://github.com/s3bk/svg"]
svg_dom = { path = "../svg/dom" }
svg_draw = { path = "../svg/draw" }
svg_text = { path = "../svg/text" }

[patch."https://github.com/pdf-rs/font"]
font = { path = "." }
